<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Task</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 50px; }
        .form-card { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>➕ Create New Task</h2>
        <form action="/add-task" method="POST"> <!-- 👈 Inga form-a close panna koodathu -->

            <label>Task Name:</label>
            <input type="text" name="title" required placeholder="Ex: Finish DBMS Project Documentation">
            
            <label>Priority:</label>
            <select name="priority">
                <option value="LOW">LOW</option>
                <option value="MEDIUM" selected>MEDIUM</option>
                <option value="HIGH">HIGH</option>
            </select>
            
            <button type="submit">Save to Database</button>
        </form> <!-- 👈 Form-a indha edathula dhaan close pannanum -->
    </div>
</body>
</html>
